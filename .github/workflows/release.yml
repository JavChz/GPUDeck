name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tag & Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches Cargo.toml version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$TAG' must follow SemVer with a leading 'v' (for example v0.1.0 or v0.2.0-beta.1)."
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag version '$TAG_VERSION' does not match Cargo.toml package.version '$CARGO_VERSION'. Update Cargo.toml version and commit before creating tag '$TAG'."
            exit 1
          fi

          IS_PRERELEASE="false"
          if [[ "$TAG_VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Verified tag ${TAG} matches Cargo.toml version ${CARGO_VERSION} (prerelease=${IS_PRERELEASE})."

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: gpudeck.exe
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: gpudeck
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows release archive & installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $ver = "${{ needs.verify.outputs.version }}"
          $target = "${{ matrix.target }}"
          $bin = "${{ matrix.bin }}"
          $pkgDir = "gpudeck-$tag-$target"
          $stage = Join-Path "dist" $pkgDir
          $archive = "$pkgDir.${{ matrix.archive_ext }}"

          New-Item -ItemType Directory -Force -Path (Join-Path $stage "assets\fonts") | Out-Null
          New-Item -ItemType Directory -Force -Path "release" | Out-Null

          Copy-Item "target\$target\release\$bin" (Join-Path $stage $bin)
          Copy-Item "LICENSE", "THIRD_PARTY_NOTICES.md", "README.md" $stage
          Copy-Item "assets\fonts\OFL.txt" (Join-Path $stage "assets\fonts\OFL.txt")

          $archivePath = Join-Path "release" $archive
          Compress-Archive -Path $stage -DestinationPath $archivePath -Force

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile = Join-Path (Resolve-Path "release") "$archive.sha256"
          [System.IO.File]::WriteAllText($shaFile, "$hash  $archive`n", [System.Text.UTF8Encoding]::new($false))

          # Build Inno Setup next->next->finish installer
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          foreach ($candidate in @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )) {
            if (-not $iscc -and (Test-Path $candidate)) {
              $iscc = $candidate
            }
          }
          if (-not $iscc) {
            choco install innosetup -y
            foreach ($candidate in @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )) {
              if (Test-Path $candidate) {
                $iscc = $candidate
                break
              }
            }
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) not found."
          }

          & $iscc "/DAppVersion=$ver" "/DAppTag=$tag" "installer\gpudeck.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $setupName = "GPUDeck-Setup-$tag-x86_64.exe"
          $setupPath = Join-Path "release" $setupName
          if (-not (Test-Path $setupPath)) {
            throw "Expected installer not found at $setupPath"
          }
          $setupHash = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSha = Join-Path (Resolve-Path "release") "$setupName.sha256"
          [System.IO.File]::WriteAllText($setupSha, "$setupHash  $setupName`n", [System.Text.UTF8Encoding]::new($false))

      - name: Package Linux release archive & deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "./target/${{ matrix.target }}/release/${{ matrix.bin }}" --version

          VER="${{ needs.verify.outputs.version }}"
          PKG_DIR="gpudeck-${{ github.ref_name }}-${{ matrix.target }}"
          STAGE="dist/${PKG_DIR}"
          ARCHIVE="${PKG_DIR}.${{ matrix.archive_ext }}"

          mkdir -p "${STAGE}/assets/fonts" release
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${STAGE}/${{ matrix.bin }}"
          chmod +x "${STAGE}/${{ matrix.bin }}"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "${STAGE}/"
          cp assets/fonts/OFL.txt "${STAGE}/assets/fonts/OFL.txt"

          tar -czf "release/${ARCHIVE}" -C dist "${PKG_DIR}"
          (cd release && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

          # Build .deb package
          DEB_VER="${VER//-/\~}"
          DEB_NAME="gpudeck_${VER}_amd64.deb"
          DEB_ROOT="dist/deb"
          mkdir -p "${DEB_ROOT}/DEBIAN" "${DEB_ROOT}/usr/bin" "${DEB_ROOT}/usr/share/applications" "${DEB_ROOT}/usr/share/doc/gpudeck"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${DEB_ROOT}/usr/bin/gpudeck"
          chmod 0755 "${DEB_ROOT}/usr/bin/gpudeck"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "${DEB_ROOT}/usr/share/doc/gpudeck/"

          cat > "${DEB_ROOT}/usr/share/applications/gpudeck.desktop" <<'EOF'
          [Desktop Entry]
          Name=GPUDeck
          Comment=Multi-GPU thermal, power limit, and throttling dashboard
          Exec=/usr/bin/gpudeck
          Terminal=false
          Type=Application
          Categories=System;Monitor;
          EOF

          cat > "${DEB_ROOT}/DEBIAN/control" <<EOF
          Package: gpudeck
          Version: ${DEB_VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Javier Garcia
          Homepage: https://github.com/JavChz/GPUDeck
          Description: Cross-platform multi-GPU thermal, power limit, and throttling dashboard
          EOF

          dpkg-deb --build --root-owner-group "${DEB_ROOT}" "release/${DEB_NAME}"
          (cd release && sha256sum "${DEB_NAME}" > "${DEB_NAME}.sha256")

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Combine SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cat release/*.sha256 | sort -k2 > release/SHA256SUMS.txt
          rm -f release/*.sha256
          cat release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GPUDeck ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}
          files: |
            release/*.exe
            release/*.deb
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
